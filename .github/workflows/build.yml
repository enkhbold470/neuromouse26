name: PlatformIO CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - main
          - sensor-cal
          - encoder-test
          - imu-turn
          - motor-freq
          - pivot-turn
          - ir-turn-test
          - wall-follow-pcnt
          - goal-blink
          - ws2812b
          - batt-volt
          - ble-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO Core
        run: pip install -r requirements-ci.txt

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
