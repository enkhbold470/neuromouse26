; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html
;
; Only environments whose sources exist under test/ (or src/) are listed here.
; CI builds the working matrix — see .github/workflows/build.yml.

[platformio]
default_envs = main

[common]
platform      = espressif32@6.5.0
board         = esp32-s3-devkitc-1
framework     = arduino
board_build.f_cpu = 240000000L
extra_scripts = post:tools/notify_upload.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
flash_speed   = 80000000L
lib_deps =
    h2zero/NimBLE-Arduino@2.5.0
    olikraus/U8g2@2.35.30

[env:main]
extends = common
build_src_filter = +<main.cpp>
lib_deps =
    ${common.lib_deps}
    fastled/FastLED@3.7.0

[env:sensor-cal]
extends = common
build_src_filter = +<../test/sensor_cal.cpp>

[env:encoder-test]
extends = common
build_src_filter = +<../test/encoder-test.cpp>

[env:imu-turn]
extends = common
build_src_filter = +<../test/mpu6500.cpp>

[env:motor-freq]
extends = common
build_src_filter = +<../test/motor-freq-config.cpp>

[env:pivot-turn]
extends = common
build_src_filter = +<../test/pivot-turn.cpp>

[env:ir-turn-test]
extends = common
build_src_filter = +<../test/ir-turn-test.cpp>

[env:wall-follow-pcnt]
extends = common
build_src_filter = +<../test/wall-follow-encoder-pcnt.cpp>

[env:goal-blink]
extends = common
build_src_filter = +<../test/goal-blink.cpp>
lib_deps =
    ${common.lib_deps}
    fastled/FastLED@3.7.0

[env:ws2812b]
extends = common
build_src_filter = +<../test/ws2812b.cpp>
lib_deps =
    ${common.lib_deps}
    fastled/FastLED@3.7.0

[env:batt-volt]
extends = common
build_src_filter = +<../test/batt-volt.cpp>

[env:ble-test]
extends = common
build_src_filter = +<../test/ble-test.cpp>
